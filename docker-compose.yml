name: heroforce

services:
  postgres:
    image: postgres:16-alpine
    container_name: heroforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heroforce}
      POSTGRES_USER: ${POSTGRES_USER:-heroforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heroforce_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-heroforce} -d ${POSTGRES_DB:-heroforce}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

